<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="timeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#090e1a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#timeGrad)" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Stylized Stopwatch / Clock Dial with Epoch Digital Accents -->
  <g filter="url(#timeGlow)">
    <!-- Clock Outer Circle -->
    <circle cx="32" cy="34" r="18" fill="none" stroke="#06b6d4" stroke-width="2.8"/>
    
    <!-- Top Stopwatch Button -->
    <rect x="29" y="10" width="6" height="4" rx="1.5" fill="#38bdf8"/>
    <line x1="32" y1="14" x2="32" y2="17" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Clock Hands (pointing to 10:10 / dynamic angle) -->
    <line x1="32" y1="34" x2="32" y2="24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="34" x2="41" y2="34" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="34" r="2.5" fill="#38bdf8"/>
    
    <!-- Small tick marks -->
    <line x1="32" y1="18" x2="32" y2="20" stroke="#64748b" stroke-width="2"/>
    <line x1="32" y1="48" x2="32" y2="50" stroke="#64748b" stroke-width="2"/>
  </g>
</svg>
